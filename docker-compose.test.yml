# Ephemeral stack for CI integration/security tests. No persistent volumes,
# no host port publishing beyond what the test runner needs, tmpfs for
# Postgres/MinIO data so state never survives a run.
name: clinic-management-saas-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clinic_app
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_DB: clinic_management_test
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic_app -d clinic_management_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: clinic_storage
      MINIO_ROOT_PASSWORD: test-only-password
    tmpfs:
      - /data
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 clinic_storage test-only-password &&
      mc mb --ignore-existing local/clinic-documents &&
      mc mb --ignore-existing local/clinic-documents-quarantine &&
      mc anonymous set none local/clinic-documents &&
      mc anonymous set none local/clinic-documents-quarantine
      "
